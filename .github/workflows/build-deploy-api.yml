name: Build and Deploy API

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      API_FTP_USERNAME:
        required: true
      API_FTP_PASSWORD:
        required: true
      API_DATABASE_CONNECTION:
        required: true
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  build-deploy:
    name: Build and deploy API
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    concurrency:
      group: plesk-api
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore FuelMeter.Api/FuelMeter.Api.csproj

      - name: Publish API
        run: dotnet publish FuelMeter.Api/FuelMeter.Api.csproj -c Release --no-restore -o publish/api

      - name: Validate and package database migrations
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'ef-tools'
          dotnet tool install dotnet-ef --version 10.0.7 --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ef = Join-Path $toolPath 'dotnet-ef.exe'
          $migrationArgs = @(
            '--configuration', 'Release', '--no-build',
            '--project', 'FuelMeter.Data/FuelMeter.Data.csproj',
            '--startup-project', 'FuelMeter.Api/FuelMeter.Api.csproj'
          )
          & $ef migrations has-pending-model-changes @migrationArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $ef migrations bundle @migrationArgs --self-contained --target-runtime win-x64 `
            --output publish/migrations/fuelmeter-sql-migrations.exe
          exit $LASTEXITCODE

      - name: Smoke test API and prepare publish files
        shell: pwsh
        run: ./.github/scripts/Test-Publish.ps1 -Application API -Directory publish/api

      - name: Configure OpenAI in the published appsettings
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OPENAI_API_KEY)) {
            throw 'The OPENAI_API_KEY Actions secret is missing.'
          }

          $path = 'publish/api/appsettings.json'
          $settings = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
          $settings.MeterScan.OpenAiApiKey = $env:OPENAI_API_KEY
          ConvertTo-Json -InputObject $settings -Depth 32 |
            Set-Content -LiteralPath $path -Encoding utf8NoBOM

      - name: Apply pending database migrations
        shell: pwsh
        env:
          DATABASE_CONNECTION: ${{ secrets.API_DATABASE_CONNECTION }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DATABASE_CONNECTION)) {
            throw 'The API_DATABASE_CONNECTION Actions secret is missing.'
          }
          & ./publish/migrations/fuelmeter-sql-migrations.exe --connection $env:DATABASE_CONNECTION
          exit $LASTEXITCODE

      - name: Take API offline
        id: offline
        env:
          FTP_USERNAME: ${{ secrets.API_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
        run: ./.github/scripts/Set-FtpAppOffline.ps1 -Mode Enable -HealthUrl https://fuelmeter.api.shrijiitservices.com/openapi/v1.json

      - name: Deploy API to Plesk
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftp.shrijiitservices.com
          username: ${{ secrets.API_FTP_USERNAME }}
          password: ${{ secrets.API_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/api/
          server-dir: /
          state-name: .fuelmeter-release-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            app_offline.htm

      - name: Bring API online
        if: ${{ always() && steps.offline.outcome && steps.offline.outcome != 'skipped' }}
        env:
          FTP_USERNAME: ${{ secrets.API_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.API_FTP_PASSWORD }}
        run: ./.github/scripts/Set-FtpAppOffline.ps1 -Mode Disable

      - name: Check the deployed API
        run: curl.exe --fail --silent --show-error --output NUL --max-time 15 --retry 5 --retry-all-errors https://fuelmeter.api.shrijiitservices.com/openapi/v1.json
