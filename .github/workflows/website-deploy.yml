name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Leave blank for the latest successful main build, or paste the run ID from its URL
        required: false
        type: string
      dry_run:
        description: Preview Plesk file changes without uploading
        type: boolean
        default: true

permissions:
  actions: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-plesk.yml
    with:
      build_run_id: ${{ inputs.build_run_id }}
      dry_run: ${{ inputs.dry_run }}
      artifact: website-build
      application: website
      health_url: https://fuelmeter.shrijiitservices.com/
    secrets:
      ftp_username: ${{ secrets.WEBSITE_FTP_USERNAME }}
      ftp_password: ${{ secrets.WEBSITE_FTP_PASSWORD }}
