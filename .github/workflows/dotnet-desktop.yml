name: Build FuelMeter

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build-android:
    name: Build Android
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android
        run: dotnet restore FuelMeter.csproj -p:TargetFramework=net10.0-android

      - name: Build Android
        run: dotnet build FuelMeter.csproj -f net10.0-android -c Release

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/bin/Release/net10.0-android/**/*.apk
            **/bin/Release/net10.0-android/**/*.aab
            **/bin/Release/net10.0-android/**/*.dll

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore Windows
        run: dotnet restore FuelMeter.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64

      - name: Build Windows
        run: dotnet build FuelMeter.csproj -f net10.0-windows10.0.19041.0 -c Release -r win-x64

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            **/bin/Release/net10.0-windows10.0.19041.0/win-x64/**/*.exe
            **/bin/Release/net10.0-windows10.0.19041.0/win-x64/**/*.dll
            **/bin/Release/net10.0-windows10.0.19041.0/win-x64/**/*.msix
