name: Build Google Play App Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: App version visible in Google Play (for example, 1.0.0)
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: Unused Android version code greater than every previous Play upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: Build and verify signed Android App Bundle
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Build and verify bundle
        shell: pwsh
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./.github/scripts/Build-PlayStoreBundle.ps1 -VersionName $env:VERSION_NAME -VersionCode $env:VERSION_CODE -OutputDirectory publish/play-store

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: FuelMeter-PlayStore-${{ inputs.version_code }}
          path: publish/play-store/FuelMeter.aab
          if-no-files-found: error
