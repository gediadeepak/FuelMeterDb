name: Build and Deploy API and Website
run-name: FuelMeter · ${{ (inputs.deploy_api || inputs.deploy_website) && inputs.release_mode || 'Build only' }}

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Choose whether to preview changes or publish to Plesk
        type: choice
        required: true
        default: Preview only
        options:
          - Preview only
          - Deploy to production
      build_api:
        description: Build and test the API and package migrations
        type: boolean
        default: true
      build_website:
        description: Build and test the website
        type: boolean
        default: true
      build_apk:
        description: Build an Android APK for download
        type: boolean
        default: false
      deploy_api:
        description: Include the API in this release
        type: boolean
        default: true
      deploy_website:
        description: Include the website in this release
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: fuelmeter-web-release
  cancel-in-progress: false

jobs:
  build-api:
    name: Build API
    if: inputs.build_api && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-api-package.yml

  build-website:
    name: Build website
    if: inputs.build_website && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-website-package.yml

  build-apk:
    name: Build Android APK
    if: inputs.build_apk && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-android-package.yml

  deploy-api:
    name: Deploy API
    needs: build-api
    if: >-
      ${{ !cancelled() && inputs.deploy_api &&
          (!inputs.build_api || needs.build-api.result == 'success') }}
    uses: ./.github/workflows/deploy-plesk.yml
    with:
      use_current_build: ${{ inputs.build_api }}
      dry_run: ${{ inputs.release_mode != 'Deploy to production' }}
      artifact: api-build
      application: api
      health_url: https://fuelmeter.api.shrijiitservices.com/openapi/v1.json
    secrets:
      ftp_username: ${{ secrets.API_FTP_USERNAME }}
      ftp_password: ${{ secrets.API_FTP_PASSWORD }}
      database_connection: ${{ secrets.API_DATABASE_CONNECTION }}

  deploy-website:
    name: Deploy Website
    needs: [build-website, deploy-api]
    if: >-
      ${{ !cancelled() && inputs.deploy_website &&
          (!inputs.build_website || needs.build-website.result == 'success') &&
          (!inputs.deploy_api || needs.deploy-api.result == 'success') }}
    uses: ./.github/workflows/deploy-plesk.yml
    with:
      use_current_build: ${{ inputs.build_website }}
      build_run_id: ${{ !inputs.build_website && !inputs.build_api && needs.deploy-api.outputs.build_run_id || '' }}
      dry_run: ${{ inputs.release_mode != 'Deploy to production' }}
      artifact: website-build
      application: website
      health_url: https://fuelmeter.shrijiitservices.com/
    secrets:
      ftp_username: ${{ secrets.WEBSITE_FTP_USERNAME }}
      ftp_password: ${{ secrets.WEBSITE_FTP_PASSWORD }}
