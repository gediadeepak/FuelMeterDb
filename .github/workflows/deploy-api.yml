name: Deploy API

on:
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Download API Artifact from Build Workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: api-build
          path: ./api-build

      - name: Deploy to Plesk
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.shrijiitservices.com
          username: fuelmeter_api
          password: YOUR_PASSWORD_HERE
          local-dir: ./api-build/
          server-dir: /httpdocs/
