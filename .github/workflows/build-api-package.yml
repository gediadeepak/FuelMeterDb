name: Build FuelMeter API package

on:
  workflow_call:

jobs:
  build-api:
    name: Build API
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore FuelMeter.Api/FuelMeter.Api.csproj

      - name: Publish API
        run: dotnet publish FuelMeter.Api/FuelMeter.Api.csproj -c Release --no-restore -o publish/api

      - name: Validate and package database migrations
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'ef-tools'
          dotnet tool install dotnet-ef --version 10.0.7 --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ef = Join-Path $toolPath 'dotnet-ef.exe'
          $migrationArgs = @(
            '--configuration', 'Release', '--no-build',
            '--project', 'FuelMeter.Data/FuelMeter.Data.csproj',
            '--startup-project', 'FuelMeter.Api/FuelMeter.Api.csproj'
          )
          & $ef migrations has-pending-model-changes @migrationArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $ef migrations bundle @migrationArgs --self-contained --target-runtime linux-x64 `
            --output publish/migrations/fuelmeter-sql-migrations
          exit $LASTEXITCODE

      - name: Smoke test API and prepare artifact
        shell: pwsh
        run: ./.github/scripts/Test-Publish.ps1 -Application API -Directory publish/api

      - name: Upload API Build
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: publish/api
          if-no-files-found: error

      - name: Upload API migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-migrations
          path: publish/migrations/fuelmeter-sql-migrations
          if-no-files-found: error
